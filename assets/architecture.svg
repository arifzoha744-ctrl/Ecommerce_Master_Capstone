<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1240" height="560" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="30" y="52" font-size="26" font-weight="700" fill="#0f172a">Solution Architecture</text>
  <text x="30" y="80" font-size="15" fill="#64748b">Each layer has one job. Data only moves forward, and every hand-off is verified.</text>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="232" y1="235" x2="272" y2="235"/>
    <line x1="477" y1="235" x2="517" y2="235"/>
    <line x1="722" y1="235" x2="762" y2="235"/>
    <line x1="967" y1="235" x2="1007" y2="235"/>
  </g>

  <!-- Box 1: Raw -->
  <g>
    <rect x="30" y="110" width="200" height="250" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="110" width="200" height="44" rx="14" fill="#475569"/>
    <rect x="30" y="140" width="200" height="14" fill="#475569"/>
    <text x="130" y="138" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">1 · RAW DATA</text>
    <text x="46" y="184" font-size="17" font-weight="700" fill="#0f172a">9 CSV files</text>
    <g font-size="12.5" fill="#334155">
      <text x="46" y="212">• Kaggle Olist dataset</text>
      <text x="46" y="234">• Orders, items, payments</text>
      <text x="46" y="256">• Reviews, customers</text>
      <text x="46" y="278">• Sellers, products, geo</text>
    </g>
    <text x="46" y="335" font-size="15" font-weight="700" fill="#475569">1.55M rows</text>
  </g>

  <!-- Box 2: Python -->
  <g>
    <rect x="275" y="110" width="200" height="250" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="275" y="110" width="200" height="44" rx="14" fill="#2563eb"/>
    <rect x="275" y="140" width="200" height="14" fill="#2563eb"/>
    <text x="375" y="138" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">2 · PYTHON</text>
    <text x="291" y="184" font-size="17" font-weight="700" fill="#0f172a">Profile &amp; clean</text>
    <g font-size="12.5" fill="#334155">
      <text x="291" y="212">• Profiling &amp; key checks</text>
      <text x="291" y="234">• Text dates → datetime</text>
      <text x="291" y="256">• Dedupe reviews &amp; geo</text>
      <text x="291" y="278">• Decision log written</text>
    </g>
    <text x="291" y="335" font-size="15" font-weight="700" fill="#2563eb">pandas</text>
  </g>

  <!-- Box 3: Staging -->
  <g>
    <rect x="520" y="110" width="200" height="250" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="520" y="110" width="200" height="44" rx="14" fill="#7c3aed"/>
    <rect x="520" y="140" width="200" height="14" fill="#7c3aed"/>
    <text x="620" y="138" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">3 · SQL SERVER</text>
    <text x="536" y="184" font-size="17" font-weight="700" fill="#0f172a">Staging layer</text>
    <g font-size="12.5" fill="#334155">
      <text x="536" y="212">• stg schema</text>
      <text x="536" y="234">• 8 explicitly typed tables</text>
      <text x="536" y="256">• Repeatable pyodbc load</text>
      <text x="536" y="278">• Counts read back</text>
    </g>
    <text x="536" y="335" font-size="15" font-weight="700" fill="#7c3aed">569,152 rows</text>
  </g>

  <!-- Box 4: Star schema -->
  <g>
    <rect x="765" y="110" width="200" height="250" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="765" y="110" width="200" height="44" rx="14" fill="#d97706"/>
    <rect x="765" y="140" width="200" height="14" fill="#d97706"/>
    <text x="865" y="138" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">4 · WAREHOUSE</text>
    <text x="781" y="184" font-size="17" font-weight="700" fill="#0f172a">Star schema</text>
    <g font-size="12.5" fill="#334155">
      <text x="781" y="212">• dw schema</text>
      <text x="781" y="234">• 4 fact tables</text>
      <text x="781" y="256">• 4 dimension tables</text>
      <text x="781" y="278">• PK / FK / grain checks</text>
    </g>
    <text x="781" y="335" font-size="15" font-weight="700" fill="#d97706">0 grain violations</text>
  </g>

  <!-- Box 5: Power BI -->
  <g>
    <rect x="1010" y="110" width="200" height="250" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <rect x="1010" y="110" width="200" height="44" rx="14" fill="#0f766e"/>
    <rect x="1010" y="140" width="200" height="14" fill="#0f766e"/>
    <text x="1110" y="138" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">5 · POWER BI</text>
    <text x="1026" y="184" font-size="17" font-weight="700" fill="#0f172a">Dashboard</text>
    <g font-size="12.5" fill="#334155">
      <text x="1026" y="212">• 4 report pages</text>
      <text x="1026" y="234">• 20 DAX measures</text>
      <text x="1026" y="256">• Seller drill-through</text>
      <text x="1026" y="278">• Time intelligence</text>
    </g>
    <text x="1026" y="335" font-size="15" font-weight="700" fill="#0f766e">Import mode</text>
  </g>

  <!-- Validation band -->
  <rect x="30" y="400" width="1180" height="125" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="72" cy="462" r="22" fill="#16a34a"/>
  <path d="M61 462 L69 471 L84 453" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="448" font-size="19" font-weight="700" fill="#14532d">Reconciled at every stage</text>
  <text x="112" y="476" font-size="14.5" fill="#166534">12 metrics compared across Raw CSV, Python and SQL Server. Row counts and money totals match to the cent;</text>
  <text x="112" y="498" font-size="14.5" fill="#166534">the one difference (551 duplicate reviews removed) is deliberate and documented.</text>
</svg>
