<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10233f"/>
      <stop offset="1" stop-color="#0f4c4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="85" x2="1280" y2="85"/>
    <line x1="0" y1="170" x2="1280" y2="170"/>
    <line x1="0" y1="255" x2="1280" y2="255"/>
  </g>

  <!-- decorative bar chart -->
  <g>
    <rect x="1015" y="230" width="22" height="70" rx="4" fill="url(#bar)"/>
    <rect x="1047" y="200" width="22" height="100" rx="4" fill="url(#bar)"/>
    <rect x="1079" y="215" width="22" height="85" rx="4" fill="url(#bar)"/>
    <rect x="1111" y="165" width="22" height="135" rx="4" fill="url(#bar)"/>
    <rect x="1143" y="140" width="22" height="160" rx="4" fill="url(#bar)"/>
    <rect x="1175" y="110" width="22" height="190" rx="4" fill="url(#bar)"/>
    <rect x="1207" y="80"  width="22" height="220" rx="4" fill="url(#bar)"/>
    <polyline points="1026,222 1058,192 1090,207 1122,157 1154,132 1186,102 1218,72"
              fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
    <circle cx="1218" cy="72" r="5" fill="#fbbf24"/>
  </g>

  <!-- logo: shopping bag holding a bar chart -->
  <g>
    <rect x="60" y="95" width="150" height="150" rx="34" fill="url(#accent)"/>
    <path d="M113 145 C113 118, 157 118, 157 145" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <rect x="93" y="140" width="84" height="82" rx="12" fill="#ffffff"/>
    <rect x="109" y="192" width="13" height="18" rx="2" fill="#0f4c4a"/>
    <rect x="129" y="179" width="13" height="31" rx="2" fill="#0f4c4a"/>
    <rect x="149" y="163" width="13" height="47" rx="2" fill="#0f4c4a"/>
  </g>

  <!-- title -->
  <text x="245" y="150" font-size="50" font-weight="700" fill="#ffffff">Olist E-Commerce Analytics</text>
  <text x="247" y="190" font-size="21" fill="#cbd5e1">End-to-end analytics pipeline  ·  Python → SQL Server → Power BI</text>

  <!-- tech pills -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="245" y="212" width="82" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="286" y="233" fill="#e2e8f0">Python</text>
    <rect x="337" y="212" width="82" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="378" y="233" fill="#e2e8f0">pandas</text>
    <rect x="429" y="212" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="488" y="233" fill="#e2e8f0">SQL Server</text>
    <rect x="557" y="212" width="76" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="595" y="233" fill="#e2e8f0">T-SQL</text>
    <rect x="643" y="212" width="100" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="693" y="233" fill="#e2e8f0">Power BI</text>
    <rect x="753" y="212" width="62" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="784" y="233" fill="#e2e8f0">DAX</text>
  </g>

  <!-- stat line -->
  <text x="247" y="292" font-size="16" fill="#94a3b8">
    <tspan fill="#fbbf24" font-weight="700">99,441</tspan> orders   ·   <tspan fill="#fbbf24" font-weight="700">96,096</tspan> customers   ·   <tspan fill="#fbbf24" font-weight="700">R$13.6M</tspan> merchandise   ·   <tspan fill="#fbbf24" font-weight="700">100%</tspan> reconciled
  </text>
</svg>
