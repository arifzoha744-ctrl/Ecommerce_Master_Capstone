<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1240" height="880" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="60" y="50" font-size="26" font-weight="700" fill="#0f172a">Star Schema — dw</text>
  <text x="60" y="78" font-size="15" fill="#64748b">Four fact tables, each at its own grain, sharing four dimensions. Facts are never joined to each other.</text>

  <!-- relationship lines (drawn first) -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <!-- product / seller to items -->
    <line x1="340" y1="195" x2="480" y2="178"/>
    <line x1="900" y1="195" x2="760" y2="178"/>
    <!-- customer to all facts -->
    <line x1="340" y1="557" x2="480" y2="262"/>
    <line x1="340" y1="557" x2="480" y2="407"/>
    <line x1="340" y1="557" x2="480" y2="592"/>
    <line x1="340" y1="557" x2="480" y2="767"/>
    <!-- date to all facts -->
    <line x1="900" y1="557" x2="760" y2="262"/>
    <line x1="900" y1="557" x2="760" y2="407"/>
    <line x1="900" y1="557" x2="760" y2="592"/>
    <line x1="900" y1="557" x2="760" y2="767"/>
  </g>
  <g fill="#94a3b8">
    <circle cx="340" cy="195" r="5"/><circle cx="900" cy="195" r="5"/>
    <circle cx="340" cy="557" r="6"/><circle cx="900" cy="557" r="6"/>
  </g>

  <!-- ================= DIMENSIONS ================= -->
  <!-- dim_product -->
  <g>
    <rect x="60" y="120" width="280" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="60" y="120" width="280" height="36" rx="12" fill="#2563eb"/>
    <rect x="60" y="144" width="280" height="12" fill="#2563eb"/>
    <text x="76" y="144" font-size="15" font-weight="700" fill="#ffffff">dim_product</text>
    <g font-size="12.5" fill="#1e293b">
      <text x="76" y="180" font-weight="700">PK product_key</text>
      <text x="76" y="200">product_id</text>
      <text x="76" y="220">category_name_english</text>
      <text x="76" y="240">weight · dimensions</text>
    </g>
    <text x="76" y="262" font-size="12" font-weight="700" fill="#2563eb">32,951 rows</text>
  </g>

  <!-- dim_seller -->
  <g>
    <rect x="900" y="120" width="280" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="900" y="120" width="280" height="36" rx="12" fill="#2563eb"/>
    <rect x="900" y="144" width="280" height="12" fill="#2563eb"/>
    <text x="916" y="144" font-size="15" font-weight="700" fill="#ffffff">dim_seller</text>
    <g font-size="12.5" fill="#1e293b">
      <text x="916" y="180" font-weight="700">PK seller_key</text>
      <text x="916" y="200">seller_id</text>
      <text x="916" y="220">city · state</text>
      <text x="916" y="240">latitude · longitude</text>
    </g>
    <text x="916" y="262" font-size="12" font-weight="700" fill="#2563eb">3,095 rows</text>
  </g>

  <!-- dim_customer -->
  <g>
    <rect x="60" y="470" width="280" height="175" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="60" y="470" width="280" height="36" rx="12" fill="#2563eb"/>
    <rect x="60" y="494" width="280" height="12" fill="#2563eb"/>
    <text x="76" y="494" font-size="15" font-weight="700" fill="#ffffff">dim_customer</text>
    <g font-size="12.5" fill="#1e293b">
      <text x="76" y="530" font-weight="700">PK customer_key</text>
      <text x="76" y="550">customer_id  (one per order)</text>
      <text x="76" y="570" font-weight="700" fill="#b45309">customer_unique_id  (the person)</text>
      <text x="76" y="590">city · state · lat / lng</text>
    </g>
    <text x="76" y="630" font-size="12" font-weight="700" fill="#2563eb">99,441 rows · 96,096 people</text>
  </g>

  <!-- dim_date -->
  <g>
    <rect x="900" y="470" width="280" height="175" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="900" y="470" width="280" height="36" rx="12" fill="#2563eb"/>
    <rect x="900" y="494" width="280" height="12" fill="#2563eb"/>
    <text x="916" y="494" font-size="15" font-weight="700" fill="#ffffff">dim_date</text>
    <g font-size="12.5" fill="#1e293b">
      <text x="916" y="530" font-weight="700">PK date_key  (YYYYMMDD)</text>
      <text x="916" y="550">full_date · year · quarter</text>
      <text x="916" y="570">month · month_name</text>
      <text x="916" y="590">year_month · day_name</text>
    </g>
    <text x="916" y="630" font-size="12" font-weight="700" fill="#2563eb">1,096 days · marked date table</text>
  </g>

  <!-- ================= FACTS ================= -->
  <!-- fact_order_items -->
  <g>
    <rect x="480" y="110" width="280" height="185" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
    <rect x="480" y="110" width="280" height="36" rx="12" fill="#d97706"/>
    <rect x="480" y="134" width="280" height="12" fill="#d97706"/>
    <text x="496" y="134" font-size="15" font-weight="700" fill="#ffffff">fact_order_items</text>
    <text x="496" y="166" font-size="12" font-style="italic" fill="#92400e">Grain: one item line in an order</text>
    <g font-size="12.5" fill="#1e293b">
      <text x="496" y="190">FK customer_key · product_key</text>
      <text x="496" y="210">FK seller_key · purchase_date_key</text>
      <text x="496" y="236" font-weight="700">price</text>
      <text x="540" y="236" fill="#64748b">(merchandise)</text>
      <text x="496" y="256" font-weight="700">freight_value</text>
    </g>
    <text x="496" y="283" font-size="12" font-weight="700" fill="#d97706">112,650 rows</text>
  </g>

  <!-- fact_orders -->
  <g>
    <rect x="480" y="325" width="280" height="165" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
    <rect x="480" y="325" width="280" height="36" rx="12" fill="#d97706"/>
    <rect x="480" y="349" width="280" height="12" fill="#d97706"/>
    <text x="496" y="349" font-size="15" font-weight="700" fill="#ffffff">fact_orders</text>
    <text x="496" y="381" font-size="12" font-style="italic" fill="#92400e">Grain: one order</text>
    <g font-size="12.5" fill="#1e293b">
      <text x="496" y="405">FK customer_key · purchase_date_key</text>
      <text x="496" y="425">order_status · delivery_days</text>
      <text x="496" y="445" font-weight="700">delivery_delay_days · is_late</text>
    </g>
    <text x="496" y="476" font-size="12" font-weight="700" fill="#d97706">99,441 rows</text>
  </g>

  <!-- fact_payments -->
  <g>
    <rect x="480" y="520" width="280" height="145" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
    <rect x="480" y="520" width="280" height="36" rx="12" fill="#d97706"/>
    <rect x="480" y="544" width="280" height="12" fill="#d97706"/>
    <text x="496" y="544" font-size="15" font-weight="700" fill="#ffffff">fact_payments</text>
    <text x="496" y="576" font-size="12" font-style="italic" fill="#92400e">Grain: one payment transaction</text>
    <g font-size="12.5" fill="#1e293b">
      <text x="496" y="600">FK customer_key · purchase_date_key</text>
      <text x="496" y="620">payment_type · installments</text>
      <text x="496" y="640" font-weight="700">payment_value</text>
    </g>
    <text x="496" y="658" font-size="12" font-weight="700" fill="#d97706">103,886 rows</text>
  </g>

  <!-- fact_reviews -->
  <g>
    <rect x="480" y="695" width="280" height="145" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
    <rect x="480" y="695" width="280" height="36" rx="12" fill="#d97706"/>
    <rect x="480" y="719" width="280" height="12" fill="#d97706"/>
    <text x="496" y="719" font-size="15" font-weight="700" fill="#ffffff">fact_reviews</text>
    <text x="496" y="751" font-size="12" font-style="italic" fill="#92400e">Grain: one reviewed order (latest)</text>
    <g font-size="12.5" fill="#1e293b">
      <text x="496" y="775">FK customer_key · purchase_date_key</text>
      <text x="496" y="795" font-weight="700">review_score</text>
      <text x="496" y="815">is_negative · is_positive</text>
    </g>
    <text x="664" y="833" font-size="12" font-weight="700" fill="#d97706">98,673 rows</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="60" y="690" width="280" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="76" y="716" font-size="14" font-weight="700" fill="#0f172a">Legend</text>
    <rect x="76" y="730" width="22" height="16" rx="3" fill="#d97706"/>
    <text x="108" y="743" font-size="12.5" fill="#334155">Fact table (measures)</text>
    <rect x="76" y="756" width="22" height="16" rx="3" fill="#2563eb"/>
    <text x="108" y="769" font-size="12.5" fill="#334155">Dimension (filters)</text>
    <line x1="76" y1="790" x2="98" y2="790" stroke="#94a3b8" stroke-width="2"/>
    <text x="108" y="794" font-size="12.5" fill="#334155">Many-to-one, single direction</text>
    <text x="76" y="822" font-size="12" fill="#64748b">Dimension side = 1 · Fact side = many</text>
  </g>

  <!-- design note -->
  <g>
    <rect x="900" y="690" width="280" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="916" y="716" font-size="14" font-weight="700" fill="#991b1b">Why four facts, not one?</text>
    <g font-size="12.5" fill="#7f1d1d">
      <text x="916" y="742">Joining items to payments</text>
      <text x="916" y="761">inflates revenue by</text>
      <text x="916" y="786" font-size="17" font-weight="700">R$617,471.64 (4.5%)</text>
      <text x="916" y="810">Separate facts + shared</text>
      <text x="916" y="829">dimensions make that impossible.</text>
    </g>
  </g>
</svg>
